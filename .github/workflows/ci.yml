name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Base SQLite jetable (relative à prisma/) : jamais la base de production.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Client Prisma et base SQLite
        run: |
          node scripts/prisma.mjs generate
          node scripts/prisma.mjs db push --skip-generate
          npm run db:seed
          npm run test:ci:seed

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
