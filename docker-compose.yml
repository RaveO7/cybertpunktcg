# Base Postgres locale pour le développement (la prod utilise Prisma Postgres sur Vercel).
# Démarrer : docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybertpunk
      POSTGRES_PASSWORD: cybertpunk
      POSTGRES_DB: cybertpunktcg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
